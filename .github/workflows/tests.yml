name: Formula Tests

on:
  pull_request:
    paths:
      - 'Formula/**'
  push:
    branches:
      - master

jobs:
  test-formulas:
    strategy:
      matrix:
        # macos-13 (Intel) free runners are retired: jobs queued the 24h max and
        # were auto-cancelled, blocking every formula PR. macos-14 (Apple Silicon)
        # matches the target platform; add an Intel `*-large` runner back here if
        # that coverage is needed again.
        os: [macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the PR base commit is reachable for `git diff` below.
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Set up tap for testing
        run: |
          # Create symlink in Homebrew's tap location
          mkdir -p "$(brew --repository)/Library/Taps/dsaenztagarro"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/dsaenztagarro/homebrew-tap"

      - name: Determine changed formulas
        id: changed-formulas
        run: |
          # Resolve the base commit to diff against. On pull_request events
          # github.event.before is empty, so fall back to the PR base branch tip;
          # on push events use the commit before the push.
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"

          if [ -z "$BASE" ] || ! git rev-parse "$BASE" >/dev/null 2>&1; then
            # Base ref unavailable (e.g. the very first commit) — test all formulas
            CHANGED_FILES=$(find Formula -name "*.rb" -type f)
          else
            # Otherwise only test the formulas this change touches
            CHANGED_FILES=$(git diff --name-only "$BASE" HEAD | grep '^Formula/.*\.rb$' || true)
          fi

          # Exclude cargo-dist-generated binary formulas. These ship prebuilt
          # release binaries (no source build) and are auto-pushed + validated by
          # cargo-dist at release time, so the source-build audit/install below
          # does not apply. cargo-dist emits a `BINARY_ALIASES` constant in every
          # formula it generates, which we use as the marker. `grep -L` lists the
          # files that do NOT contain it.
          if [ -n "$CHANGED_FILES" ]; then
            CHANGED_FILES=$(grep -L "BINARY_ALIASES" $CHANGED_FILES || true)
          fi

          # Emit as a multi-line output via a heredoc delimiter so a list spanning
          # several formula paths is stored intact. A plain `changed_formulas=...`
          # line stops at the first newline and Actions rejects the remainder.
          {
            echo "changed_formulas<<EOF"
            echo "$CHANGED_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Audit formulas
        run: |
          for formula in ${{ steps.changed-formulas.outputs.changed_formulas }}; do
            if [ -n "$formula" ]; then
              # Extract formula name without path and .rb extension
              formula_name=$(basename "$formula" .rb)
              echo "Auditing dsaenztagarro/tap/$formula_name"
              brew audit --strict --online "$(pwd)/$formula" || echo "Audit failed for $formula_name"
            fi
          done

      - name: Install and test formulas
        run: |
          for formula in ${{ steps.changed-formulas.outputs.changed_formulas }}; do
            if [ -n "$formula" ]; then
              # Extract formula name without path and .rb extension
              formula_name=$(basename "$formula" .rb)
              echo "Installing dsaenztagarro/tap/$formula_name"
              brew install --build-from-source "dsaenztagarro/tap/$formula_name"
              brew test "dsaenztagarro/tap/$formula_name" || echo "No tests defined for $formula_name"
            fi
          done

      - name: Check for conflicts
        run: |
          brew doctor || true
